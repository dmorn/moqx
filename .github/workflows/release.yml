name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    name: publish Hex package and GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.0'
          otp-version: '27.3'

      - name: Cache Mix
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Validate tag, mix.exs version, and changelog version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          mix_version=$(grep -E '^[[:space:]]*version:[[:space:]]*"[^"]+"' mix.exs | head -n1 | sed -E 's/.*version:[[:space:]]*"([^"]+)".*/\1/')

          if [ -z "$mix_version" ]; then
            echo "Failed to extract version from mix.exs"
            exit 1
          fi

          if [ "$tag_version" != "$mix_version" ]; then
            echo "Tag version $tag_version does not match mix.exs version $mix_version"
            exit 1
          fi

          if ! grep -q "^## \[$tag_version\]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a section for version $tag_version"
            exit 1
          fi

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run unit tests
        run: mix test

      - name: Run Credo
        run: mix credo --strict

      - name: Publish package to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "Failed to extract release notes for version $version from CHANGELOG.md"
            exit 1
          fi

          echo "RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "moqx $TAG_NAME" --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create "$TAG_NAME" --title "moqx $TAG_NAME" --notes-file "$RELEASE_NOTES_FILE"
          fi
