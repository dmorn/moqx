name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  checks:
    name: format and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.0'
          otp-version: '27.3'

      - name: Cache Mix
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run fast checks
        run: mix ci

  moqtail-draft-18:
    name: MOQtail draft-18 relay interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Run pinned MOQtail draft-18 integration
        run: scripts/run_moqtail_draft18_integration.sh

  curley-moq-lite-05:
    name: Curley MoQ Lite 05 relay interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Run pinned Curley integration
        run: scripts/run_curley_moq_lite_05_integration.sh
