[tools]
elixir = "1.20.0-rc.3-otp-28"
erlang = "28.4"
go = "1.23"
just = "1.51.0"
zig = "0.15.2"

[tasks."tools:zig:install-patched"]
description = "Install the patched Zig 0.15.2 toolchain needed by Burrito on macOS"
run = '''
#!/usr/bin/env bash
set -euo pipefail

case "$(uname -s)" in
  Darwin)
    if ! command -v brew >/dev/null 2>&1; then
      printf '%s\n' 'Homebrew is required for patched Zig 0.15.2 on macOS.' >&2
      exit 2
    fi

    if ! HOMEBREW_NO_AUTO_UPDATE=1 brew list --versions zig@0.15 >/dev/null 2>&1; then
      brew install zig@0.15
    fi
    ;;
  *)
    mise install zig@0.15.2
    ;;
esac
'''

[tasks."tools:zig:doctor"]
description = "Verify the Zig toolchain Burrito will use"
tools.zig = "0.15.2"
env.ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.tmp/zig-cache"
run = '''
#!/usr/bin/env bash
set -euo pipefail

case "$(uname -s)" in
  Darwin)
    if ! command -v brew >/dev/null 2>&1; then
      printf '%s\n' 'Homebrew is required for patched Zig 0.15.2 on macOS.' >&2
      exit 2
    fi

    if ! HOMEBREW_NO_AUTO_UPDATE=1 brew list --versions zig@0.15 >/dev/null 2>&1; then
      printf '%s\n' 'Missing patched Zig 0.15.2. Run: mise run tools:zig:install-patched' >&2
      exit 2
    fi

    zig_path="$(HOMEBREW_NO_AUTO_UPDATE=1 brew --prefix zig@0.15)/bin/zig"
    ;;
  *)
    zig_path="$(command -v zig)"
    ;;
esac

if [ ! -x "$zig_path" ]; then
  printf 'Zig executable not found at %s\n' "$zig_path" >&2
  exit 2
fi

version="$("$zig_path" version)"
if [ "$version" != "0.15.2" ]; then
  printf 'Burrito requires Zig 0.15.2, found %s at %s\n' "$version" "$zig_path" >&2
  exit 2
fi

if [ "$(uname -s)" = "Darwin" ]; then
  "$zig_path" libc >/dev/null
fi

printf 'Zig %s ready at %s\n' "$version" "$zig_path"
'''

[tasks."bench:moqxprobe:burrito"]
description = "Build an experimental Burrito-wrapped moqxprobe binary"
usage = '''
flag "--target <target>" help="Burrito target alias" default="darwin_arm64"
'''
dir = "{{config_root}}/bench/moqxprobe"
depends = ["tools:zig:doctor"]
env.MIX_ENV = "prod"
env.ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.tmp/zig-cache"
run = '''
#!/usr/bin/env bash
set -euo pipefail

case "$(uname -s)" in
  Darwin)
    export PATH="$(HOMEBREW_NO_AUTO_UPDATE=1 brew --prefix zig@0.15)/bin:$PATH"
    ;;
esac

export BURRITO_TARGET="${usage_target:?}"
mix clean
mix release moqxprobe_burrito --overwrite
'''
