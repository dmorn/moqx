services:
  certs:
    image: alpine:3.20
    working_dir: /certs
    volumes:
      - ./.tmp/integration-certs:/certs
    command:
      - sh
      - -eu
      - -c
      - |
        apk add --no-cache openssl >/dev/null

        cat > openssl.cnf <<'EOF'
        [ req ]
        default_bits = 2048
        distinguished_name = req_distinguished_name
        req_extensions = v3_req
        prompt = no

        [ req_distinguished_name ]
        CN = localhost

        [ v3_req ]
        keyUsage = keyEncipherment, dataEncipherment, digitalSignature
        extendedKeyUsage = serverAuth, clientAuth
        subjectAltName = @alt_names

        [ alt_names ]
        DNS.1 = localhost
        DNS.2 = quic-ref-server
        DNS.3 = host.docker.internal
        IP.1 = 127.0.0.1
        EOF

        openssl genrsa -out ca-key.pem 2048
        openssl req -x509 -new -nodes -key ca-key.pem -sha256 -days 7 \
          -subj "/CN=moqx integration CA" -out ca.pem

        openssl genrsa -out server-key.pem 2048
        openssl req -new -key server-key.pem -out server.csr -config openssl.cnf
        openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem \
          -CAcreateserial -out server.pem -days 7 -sha256 \
          -extensions v3_req -extfile openssl.cnf

        chmod 0644 ca.pem server.pem server-key.pem

  quic-ref-server:
    image: golang:1.23-alpine
    working_dir: /workspace
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      QUICPROBE_ALPN: moqx-test
    volumes:
      - .:/workspace
      - ./.tmp/integration-certs:/certs:ro
    command:
      - go
      - run
      - ./tools/quicprobe
      - server
      - --addr
      - :4433
      - --cert
      - /certs/server.pem
      - --key
      - /certs/server-key.pem
      - --alpn
      - moqx-test
    ports:
      - "4433:4433/udp"
