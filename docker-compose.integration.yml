services:
  certs:
    image: alpine:3.20
    working_dir: /certs
    volumes:
      - ./.tmp/integration-certs:/certs
      - ./scripts:/scripts:ro
    command:
      - sh
      - -eu
      - -c
      - |
        apk add --no-cache openssl >/dev/null
        sh /scripts/gen-loopback-certs.sh /certs

  quic-ref-server:
    image: golang:1.23-alpine
    working_dir: /workspace
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      QUICPROBE_ALPN: moqx-test
    volumes:
      - .:/workspace
      - ./.tmp/integration-certs:/certs:ro
    command:
      - sh
      - -eu
      - -c
      - |
        go build -o /tmp/quicprobe ./bench/quicprobe
        exec /tmp/quicprobe server \
          --addr :4433 \
          --cert /certs/server.pem \
          --key /certs/server-key.pem \
          --alpn moqx-test
    ports:
      - "4433:4433/udp"
    healthcheck:
      test:
        - CMD
        - /tmp/quicprobe
        - client
        - --addr
        - 127.0.0.1:4433
        - --ca
        - /certs/ca.pem
        - --servername
        - localhost
        - --alpn
        - moqx-test
        - --bidi-echo
        - health
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s

  curley-moq-lite-05-relay:
    image: moqx-curley-moq-lite-05
    build:
      context: .
      dockerfile: docker/relays/curley/Dockerfile
      args:
        MOQ_REF: fd477082c43c3c0738fb62d077d85ea078f10045
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - /usr/local/bin/moq-relay
      - --server-bind
      - "0.0.0.0:443"
      - --server-version
      - moq-lite-05
      - --tls-cert
      - /certs/server.pem
      - --tls-key
      - /certs/server-key.pem
      - --auth-public
      - ""
    volumes:
      - ./.tmp/integration-certs:/certs:ro
    ports:
      - "4463:443/udp"

  moqx-curley-moq-lite-05-test:
    build:
      context: .
      dockerfile: docker/integration/curley/Dockerfile
    depends_on:
      curley-moq-lite-05-relay:
        condition: service_started
    volumes:
      - ./.tmp/integration-certs:/certs:ro

  moqx-curley-moq-lite-05-public-test:
    build:
      context: .
      dockerfile: docker/integration/Dockerfile
    command:
      - mix
      - test
      - test/integration/curley_moq_lite_05_public_test.exs
      - --include
      - integration
      - --include
      - curley_moq_lite_05_public

  moqtail-draft18-relay:
    image: moqx-moqtail-draft18-relay
    build:
      context: .
      dockerfile: docker/relays/moqtail/Dockerfile
      args:
        MOQTAIL_REF: 0e265d8bf133f86e17472c59f14ca7dc62032900
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      RUST_LOG: info
    command:
      - /usr/local/bin/moqtail-relay
      - --host
      - "0.0.0.0"
      - --port
      - "4433"
      - --cert-file
      - /certs/server.pem
      - --key-file
      - /certs/server-key.pem
    volumes:
      - ./.tmp/integration-certs:/certs:ro
    ports:
      - "4473:4433/udp"

  moqx-moqtail-draft18-test:
    build:
      context: .
      dockerfile: docker/integration/Dockerfile
    depends_on:
      moqtail-draft18-relay:
        condition: service_started
    volumes:
      - ./.tmp/integration-certs:/certs:ro
    command:
      - mix
      - test
      - test/integration/moqtail_draft_18_relay_test.exs
      - --include
      - integration
      - --include
      - moqtail_draft18_relay
