services:
  certs:
    image: alpine:3.20
    working_dir: /certs
    volumes:
      - ./.tmp/integration-certs:/certs
      - ./scripts:/scripts:ro
    command:
      - sh
      - -eu
      - -c
      - |
        apk add --no-cache openssl >/dev/null
        sh /scripts/gen-loopback-certs.sh /certs

  quic-ref-server:
    image: golang:1.23-alpine
    working_dir: /workspace
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      QUICPROBE_ALPN: moqx-test
    volumes:
      - .:/workspace
      - ./.tmp/integration-certs:/certs:ro
    command:
      - sh
      - -eu
      - -c
      - |
        go build -o /tmp/quicprobe ./bench/quicprobe
        exec /tmp/quicprobe server \
          --addr :4433 \
          --cert /certs/server.pem \
          --key /certs/server-key.pem \
          --alpn moqx-test
    ports:
      - "4433:4433/udp"
    healthcheck:
      test:
        - CMD
        - /tmp/quicprobe
        - client
        - --addr
        - 127.0.0.1:4433
        - --ca
        - /certs/ca.pem
        - --servername
        - localhost
        - --alpn
        - moqx-test
        - --bidi-echo
        - health
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
