services:
  certs:
    image: alpine:3.20
    working_dir: /certs
    volumes:
      - ./.tmp/integration-certs:/certs
      - ./scripts:/scripts:ro
    command:
      - sh
      - -eu
      - -c
      - |
        apk add --no-cache openssl >/dev/null
        sh /scripts/gen-loopback-certs.sh /certs

  quic-ref-server:
    image: golang:1.23-alpine
    working_dir: /workspace
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      QUICPROBE_ALPN: moqx-test
    volumes:
      - .:/workspace
      - ./.tmp/integration-certs:/certs:ro
    command:
      - sh
      - -eu
      - -c
      - |
        go build -o /tmp/quicprobe ./bench/quicprobe
        exec /tmp/quicprobe server \
          --addr :4433 \
          --cert /certs/server.pem \
          --key /certs/server-key.pem \
          --alpn moqx-test
    ports:
      - "4433:4433/udp"
    healthcheck:
      test:
        - CMD
        - /tmp/quicprobe
        - client
        - --addr
        - 127.0.0.1:4433
        - --ca
        - /certs/ca.pem
        - --servername
        - localhost
        - --alpn
        - moqx-test
        - --bidi-echo
        - health
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s

  moq-rs-relay:
    build:
      context: .
      dockerfile: docker/relays/moq-rs/Dockerfile
      args:
        MOQ_RS_REF: 69302d3dc2422e93b8a1d62f853a6759aa9e5468
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      RUST_LOG: info,quinn=warn
    command:
      - --bind
      - "0.0.0.0:443"
      - --tls-cert
      - /certs/server.pem
      - --tls-key
      - /certs/server-key.pem
      - --dev
    volumes:
      - ./.tmp/integration-certs:/certs:ro
    ports:
      - "4443:443/tcp"
      - "4443:443/udp"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --cacert
        - /certs/ca.pem
        - https://localhost/fingerprint
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  moqx-moq-rs-test:
    build:
      context: .
      dockerfile: docker/integration/Dockerfile
    depends_on:
      moq-rs-relay:
        condition: service_healthy
    volumes:
      - ./.tmp/integration-certs:/certs:ro
